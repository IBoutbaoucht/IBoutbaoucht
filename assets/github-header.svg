<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Systems engineering, cybersecurity, robotics, and software</title>
  <desc id="desc">Systems engineering, cybersecurity, robotics, and software</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b5666"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="75%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9bd8df" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <text x="80" y="140" fill="#99f6e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">SYSTEMS ENGINEERING · CYBERSECURITY · ROBOTICS</text>
  <text x="80" y="186" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building software that connects simulation, infrastructure, and physical systems.</text>
</svg>
